name: orangescrum

# Single self-contained stack: Orangescrum app + MySQL.
#   docker compose up -d --build
#
# Every instance-specific value (ports, credentials, public URL) comes from the
# environment with sensible defaults — copy .env.example to .env to override.
# Nothing is hard-coded here.

services:
  orangescrum-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port is configurable; the container always listens on 80.
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: orangescrum-mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-orangescrum}
      DB_PASSWORD: ${DB_PASSWORD:-orangescrum}
      DB_NAME: ${DB_NAME:-orangescrum}
      CACHE_ENGINE: ${CACHE_ENGINE:-file}
      # Persisted security salt (hashing / CSRF / sessions). Set it in .env so
      # it stays stable across container/app_local rebuilds; leave it unset to
      # let the installer generate a random per-install salt.
      SECURITY_SALT: ${SECURITY_SALT:-}
      # Public URL the browser uses — MUST match the published host port and
      # scheme. Set FULL_BASE_URL in .env when you change APP_PORT or use HTTPS.
      FULL_BASE_URL: ${FULL_BASE_URL:-http://localhost:8080}
      # Set to "true" only when served over HTTPS (e.g. behind a TLS proxy).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ORANGESCRUM_SESSID}
      # Leave empty to scope the cookie to the exact host. Set it (with a
      # leading dot) only to share sessions across subdomains.
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-orangescrum_csrf}
      # Set to false to remove the in-app upgrade/add-on pages entirely.
      SHOW_UPGRADE_CTA: ${SHOW_UPGRADE_CTA:-true}
    volumes:
      - orangescrum-app-files:/var/www/html/webroot/files
      - orangescrum-app-config:/var/www/html/config
    depends_on:
      orangescrum-mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orangescrum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  orangescrum-mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-orangescrum}
      MYSQL_USER: ${DB_USERNAME:-orangescrum}
      MYSQL_PASSWORD: ${DB_PASSWORD:-orangescrum}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-orangescrum_root}
    volumes:
      - orangescrum-mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - orangescrum-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  orangescrum-app-files:
  orangescrum-app-config:
  orangescrum-mysql-data:

networks:
  orangescrum-network:
    driver: bridge
